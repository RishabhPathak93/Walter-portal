# Supabase CLI project config (used by `npx supabase link` / `npx supabase db push`
# and by the optional local stack). Hosted project settings such as Auth URLs are
# configured in the Supabase dashboard; see docs/DEPLOYMENT.md.
project_id = "walter-portal"

[api]
schemas = ["public", "graphql_public"]

[db]
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

[auth.email]
enable_confirmations = false
